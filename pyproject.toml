[project]
name = "hsc"
version = "0.1.0"
description = "A self-consistency test across forecast horizons for time-series foundation models"
authors = [{ name = "Yasaman Samadzadeh" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "transformers==4.57.6",
  "accelerate==1.15.0",
  "huggingface-hub==0.36.2",
  "chronos-forecasting==1.5.3",
  "timestral",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pyarrow>=26.0.0",
  "matplotlib>=3.11.2",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]==3.0.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
